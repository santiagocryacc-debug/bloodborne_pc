
name: Build Bloodborne for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - windows

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find Windows Python
        id: python-path
        shell: pwsh
        run: |
          "path=$((Get-Command python).Source)" >> $env:GITHUB_OUTPUT

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: Build Windows executables
        shell: msys2 {0}
        run: |
          git submodule update --init --recursive
          bash build.sh

      - name: Package Windows release
        shell: msys2 {0}
        env:
          WINPYTHON: ${{ steps.python-path.outputs.path }}
        run: |
          WINPYTHON="$(cygpath -u "$WINPYTHON")"
          export WINPYTHON
          bash packaging/windows/package.sh

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: bbport-windows
          path: |
            dist/bbport-windows.zip
            dist/bbport-windows/**
          if-no-files-found: error
          retention-days: 7
